; NEON LINK — Teensy 4.1 build target (docs/TEENSY41.md).
;
; Hardware: PJRC Teensy 4.1 (i.MX RT1062, 600 MHz) with 16 MB PSRAM
; soldered on the underside pads, native Ethernet (MagJack on the
; Ethernet header), a 2.8" 320x240 SPI colour touchscreen (ILI9341 +
; XPT2046 — the PJRC-standard display), two EC11 rotary encoders, TRS
; MIDI on Serial1, and (optionally) an SGTL5000 audio shield for the
; audio engine.
;
;   pio run                # build
;   pio run -t upload      # flash over USB (teensy-loader)
;   pio device monitor     # 115200 baud serial console
;
; The portable firmware core (components/neon_core, header-only
; components/neon_hal) and Ableton Link (third_party/link, with the
; asio-free teensy41 platform in link_platform/) are compiled straight
; from the repo by scripts/build_core.py — same sources as the ESP32-S3
; target and the host test suite, no copies.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; neon_core is C++17 (same bar as the IDF and host builds). Ableton Link
; throws on hard faults (socket loss, bad payloads), so exceptions are on
; — the 8 MB flash absorbs the table cost.
build_unflags =
    -std=gnu++14
build_flags =
    -std=gnu++17
    -DUSB_SERIAL
    -DNEON_T41_FIRMWARE=\"teensy41\"
    -Wall
    -Wextra

; Exceptions are enabled ONLY for project sources (and the neon_core /
; Link build in scripts/build_core.py): Ableton Link throws and catches,
; and all of that code lands in ITCM next to the .ARM.exidx table.
; Framework + library code keeps the platform's -fno-exceptions — their
; FLASHMEM functions would otherwise emit unwind entries whose PREL31
; offsets cannot span the ITCM<->FLASH distance (the classic Teensy 4
; exceptions link failure).
; -Wno-multichar: Ableton Link's payload keys are intentional
; multi-character constants ('sess', 'tmln', ...).
build_src_flags =
    -fexceptions
    -Wno-multichar

extra_scripts = pre:scripts/build_core.py

; ILI9341_t3, XPT2046_Touchscreen, Audio, LittleFS, SPI and EEPROM ship
; inside the Teensyduino framework package; QNEthernet (native Ethernet +
; mDNS) comes from the registry.
lib_deps =
    ssilverman/QNEthernet@^0.30.0

monitor_speed = 115200
