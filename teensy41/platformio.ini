; NEON LINK — Teensy 4.1 build target (docs/TEENSY41.md).
;
; Hardware: PJRC Teensy 4.1 (i.MX RT1062, 600 MHz) with 16 MB PSRAM
; soldered on the underside pads, a 2.8" 320x240 SPI colour touchscreen
; (ILI9341 panel + XPT2046 resistive touch controller — the PJRC-standard
; display), and two EC11-class rotary encoders with push switches.
;
;   pio run                # build
;   pio run -t upload      # flash over USB (teensy-loader)
;   pio device monitor     # 115200 baud serial console
;
; The portable firmware core (components/neon_core, header-only
; components/neon_hal) is compiled straight from the repo by
; scripts/build_core.py — same sources the ESP32-S3 target and the host
; test suite build, no copies.

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino

; neon_core is C++17 (same bar as the IDF and host builds).
build_unflags = -std=gnu++14
build_flags =
    -std=gnu++17
    -DUSB_SERIAL
    -Wall
    -Wextra

extra_scripts = pre:scripts/build_core.py

; ILI9341_t3, XPT2046_Touchscreen, SPI and EEPROM all ship inside the
; Teensyduino framework package — no external lib_deps needed.

monitor_speed = 115200
