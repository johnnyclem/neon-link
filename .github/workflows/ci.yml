name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Host unit tests (gcc + ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S host -B build-host -DCMAKE_BUILD_TYPE=Debug -DNEON_SANITIZERS=ON
      - name: Build
        run: cmake --build build-host -j
      - name: Test
        run: ctest --test-dir build-host --output-on-failure

  design-system:
    name: Design system (generated files, contrast, web bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Colours, layout constants, status words, icons and the hero numerals
      # all live in design/ and are generated into both surfaces. If a
      # generated file has drifted from its source, the two surfaces have
      # started disagreeing — fail before that reaches hardware.
      - name: Generated files are in sync
        run: python3 scripts/gen_design.py --check

      # High contrast is non-negotiable on both surfaces (DESIGN_SYSTEM.md
      # §12), and palettes drift when they are only checked by eye.
      - name: Palette meets its contrast targets
        run: python3 scripts/check_contrast.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci
        working-directory: web

      - name: Typecheck
        run: npm run typecheck
        working-directory: web

      # Rebuilds the bundle and checks the committed .gz matches. The
      # artifact is committed so `idf.py build` needs no Node toolchain;
      # this step is what stops "committed" turning into "stale".
      - name: Web bundle is built and committed
        run: |
          npm run build
          cd ..
          if ! git diff --quiet -- components/web_ui/www/dist/index.html.gz; then
            echo "::error::The committed web bundle is out of date."
            echo "Run 'npm run build' in web/ and commit components/web_ui/www/dist/index.html.gz."
            exit 1
          fi
        working-directory: web

      - name: Style guide builds
        run: npm run build:styleguide
        working-directory: web

  device-screens:
    name: Device screens match the renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      # design/screens.json is rendered by the firmware's own render_ui().
      # If the panel's design changed without the fixtures being refreshed,
      # the style guide would be showing screens the device no longer draws.
      - name: Configure
        run: cmake -S host -B build-host -DCMAKE_BUILD_TYPE=Release -DNEON_SANITIZERS=OFF
      # Target-scoped on purpose: this job exists to check the fixtures, and
      # it doubles as the only optimized build of neon_core we have — several
      # -Werror analyses (format-truncation, stringop-overflow) only run with
      # optimization on, so a Debug-only loop misses them. Do not widen it to
      # the whole project: neon_tests trips a GCC 13 false positive on
      # std::string under -O2 that predates this job.
      - name: Build renderer
        run: cmake --build build-host --target neon_screens -j
      - name: Screens are up to date
        run: |
          ./build-host/neon_screens > design/screens.json
          if ! git diff --quiet -- design/screens.json; then
            echo "::error::design/screens.json is stale."
            echo "Run './build-host/neon_screens > design/screens.json' and commit it."
            git diff --stat -- design/screens.json
            exit 1
          fi

  firmware-build:
    name: ESP-IDF build (esp32s3, ${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [link, stub, bleoff, amyboard-audio, stub-audio]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.2
          target: esp32s3
          path: '.'
          command: >-
            idf.py
            ${{ matrix.variant == 'stub' && '-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.stub"' || '' }}
            ${{ matrix.variant == 'bleoff' && '-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.bleoff"' || '' }}
            ${{ matrix.variant == 'amyboard-audio' && '-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.amyboard;sdkconfig.ci.audio"' || '' }}
            ${{ matrix.variant == 'stub-audio' && '-DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.ci.stub;sdkconfig.ci.audio"' || '' }}
            build

      # The AMYboard image has to fit the OTA slot it will be flashed into,
      # and "it built" is not the same statement. 6 MB slots, checked here
      # so a size regression fails in CI rather than during an update.
      - name: App image fits its OTA slot
        if: matrix.variant == 'amyboard-audio'
        run: |
          size=$(stat -c%s build/neon-link.bin 2>/dev/null || stat -c%s build/*.bin | head -1)
          limit=$((6 * 1024 * 1024))
          echo "app image: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::error::The app image no longer fits the 6 MB OTA slot."
            exit 1
          fi

  teensy41-build:
    name: Teensy 4.1 build (PlatformIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-teensy41-${{ hashFiles('teensy41/platformio.ini') }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PlatformIO
        run: pip install platformio
      # Compiles the same neon_core sources as the host and ESP-IDF jobs,
      # but with the arm-none-eabi toolchain and the Arduino glue in
      # teensy41/src — catches target-only breakage (docs/TEENSY41.md).
      - name: Build firmware
        run: pio run -d teensy41

  daisy-build:
    name: Daisy Seed build (Makefile + libDaisy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Build libDaisy
        run: make -C third_party/libDaisy -j$(nproc)
      # Compiles the same neon_core sources as the host, ESP-IDF, and
      # Teensy jobs, but with the arm-none-eabi toolchain and the
      # bare-metal glue in daisy/src — catches target-only breakage
      # (docs/DAISY.md). Each image must keep fitting the STM32H750's
      # single 128 KB internal-flash sector; the linker fails the job if
      # one stops fitting.
      - name: Build firmware (Seed OLED)
        run: make -C daisy -j$(nproc)
      - name: Build firmware (Pod headless)
        run: make -C daisy/pod -j$(nproc)
      - name: Build firmware (patch.init() headless)
        run: make -C daisy/patch_init -j$(nproc)

  plugin-macos:
    name: Plugin (macOS VST3)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        run: cmake -S plugin -B build-plugin -DCMAKE_BUILD_TYPE=Release
      - name: Build VST3
        run: cmake --build build-plugin -j --target NeonLink_VST3
      - name: Artifact exists
        run: |
          found=$(find build-plugin -name "NEON LINK.vst3" -type d | head -1)
          echo "vst3=$found"
          test -n "$found"

