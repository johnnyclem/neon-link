; M5Stamp S3 — UART MIDI @ 31250 ↔ class-compliant USB MIDI.
; Must be USB-OTG (TinyUSB). The stock board flag is Hardware CDC/JTAG.
[env:m5stack-stamps3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = m5stack-stamps3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_mode = qio
build_unflags =
    -DARDUINO_USB_MODE=1
build_flags =
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
