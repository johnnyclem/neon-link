; RP2040 UART MIDI @ 31250 ↔ class-compliant USB MIDI (TinyUSB).
; Pico / Pico W / any RP2040. GP1 = RX from CrowPanel IO21.
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 0m
upload_speed = 921600
monitor_speed = 115200
build_flags =
    -DUSE_TINYUSB
    -DMIDI_RX_PIN=1
    -DMIDI_TX_PIN=0
lib_deps =
    adafruit/Adafruit NeoPixel

[env:pico_w]
extends = env:pico
board = rpipicow

[env:xiao_rp2040]
extends = env:pico
board = seeed_xiao_rp2040
; Same UART0 pins as Pico (GP1 RX / GP0 TX), labelled D7 / D6 on the XIAO.
; NeoPixel GP12 + power GP11 come from the board variant.
; Seeed 6x10 RGB MATRIX stacked on the XIAO (60 WS2812 on D0 / GPIO26).
; Physical grid is 6 wide × 10 tall, row-major L→R then down. MIDI on D7.
; Upside-down: -DMATRIX_FLIP_Y=1 (and -DMATRIX_FLIP_X=1 if also mirrored).
[env:xiao_matrix]
extends = env:xiao_rp2040
build_flags =
    ${env:pico.build_flags}
    -DMATRIX_PIN=26
    -DMATRIX_W=6
    -DMATRIX_H=10
    -DMATRIX_COUNT=60
