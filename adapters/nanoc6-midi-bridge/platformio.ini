; M5Stack NanoC6 (ESP32-C6) — UART MIDI ↔ BLE MIDI (+ USB CDC for Hairless).
; The C6 USB-C is Serial/JTAG only. It cannot be a USB-MIDI class device.
[env:m5stack-nanoc6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
upload_speed = 921600
monitor_speed = 115200
board_build.flash_mode = qio
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.2
