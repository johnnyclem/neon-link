dependencies:
  # .local hostname for the web editor (milestone 8) and general discovery.
  espressif/mdns: "^1.0.0"
  # ESP32-P4 has no radio. WiFi/SoftAP go through the module's ESP32-C6
  # over SDIO (ESP-Hosted). Same versions as Waveshare's 10_wifistation
  # example for IDF 5.3. Not pulled on S3 / AMYboard builds.
  # Factory C6 slave firmware on these modules speaks Hosted 1.x.
  # Host 2.12 on IDF 5.5 brought the AP up, then it vanished on join
  # (host 2.12.0 vs co-proc 0.0.0). Stay on 1.4 until we reflash the C6.
  espressif/esp_wifi_remote:
    matches:
      - if: "idf_version >= 6.0 && target == esp32p4"
        version: ">=1.6,<2.0"
      - if: "target == esp32p4"
        version: "0.14.*"
  espressif/esp_hosted:
    matches:
      - if: "idf_version >= 6.0 && target == esp32p4"
        version: ">=2.12,<3.0"
      - if: "target == esp32p4"
        version: "1.4.*"
